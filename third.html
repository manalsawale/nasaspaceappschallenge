<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Postcard from the Moon</title>
<style>
  html, body { height: 100%; margin: 0; background: #04103a; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }

  /* Keeps the GIF's 16:9 shape and fits it inside any screen */
  .stage {
    position: relative;
    width: min(100vw, 100vh * 16 / 9);
    aspect-ratio: 16 / 9;
  }
  .stage img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }

  /* Invisible clickable area placed over the button drawn in the GIF */
  .postcard-link {
    position: absolute;
    left: 38%; top: 67.5%; width: 21.5%; height: 11%;
    pointer-events: none;            /* off until the button appears in the GIF */
    cursor: pointer;
  }
  .postcard-link.ready { pointer-events: auto; }
  .postcard-link:hover, .postcard-link:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
</style>
</head>
<body>
  <div class="stage">
    <img src="robot.gif" alt="Luna the robot says: Oh! A postcard for you has come from the moon!">
    <a class="postcard-link" id="postcard" href="postcard.html" aria-label="Click here to view the postcard"></a>
  </div>

  <script>
    // The button shows up in the GIF about 10 seconds after the page loads.
    setTimeout(function () {
      document.getElementById('postcard').classList.add('ready');
    }, 10000);
  </script>
</body>
</html>
