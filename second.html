
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Postcards from the Moon</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: #142541;
        }

        /* GIF BACKGROUND */

        .background {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;

            background-image: url("space.gif");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            z-index: 1;
        }

        /* INVISIBLE NEXT BUTTON */

        .next-hotspot {
            position: fixed;

            left: 37.7%;
            top: 88.5%;
            width: 24.5%;
            height: 11%;

            display: block;
            cursor: pointer;

            z-index: 10;
        }

        .next-hotspot:focus-visible {
            outline: 3px solid white;
        }

    </style>

</head>

<body>

    <!-- ANIMATED BACKGROUND -->

    <div class="background"></div>

    <!-- CLICKABLE NEXT BUTTON -->

    <a href="third.html"
       class="next-hotspot"
       aria-label="Go to the next page">
    </a>

</body>
</html>
